name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup PHP di GitHub Actions runner
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, sqlite3, pdo_sqlite
          tools: composer
          coverage: none

      # 3. Install PHP dependencies DI RUNNER
      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      # 4. Upload release ke VPS
      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "."
          target: ${{ secrets.REMOTE_PATH }}/releases/${{ github.sha }}
          exclude: ".git,.github,node_modules,.env,storage,database/database.sqlite,tests"

      # 5. Prepare dan activate release
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            REPO_PATH="${{ secrets.REMOTE_PATH }}"
            RELEASE_DIR="$REPO_PATH/releases/${{ github.sha }}"
            CURRENT_DIR="$REPO_PATH/current"
            SHARED_DIR="$REPO_PATH/shared"

            echo "==> Preparing directories"

            mkdir -p "$REPO_PATH/releases"
            mkdir -p "$SHARED_DIR/storage"
            mkdir -p "$SHARED_DIR/database"

            echo "==> Preparing .env"

            if [ ! -f "$SHARED_DIR/.env" ]; then
              if [ -f "$RELEASE_DIR/.env.example" ]; then
                cp "$RELEASE_DIR/.env.example" "$SHARED_DIR/.env"
              else
                echo "ERROR: .env.example not found"
                exit 1
              fi
            fi

            echo "==> Preparing SQLite database"

            touch "$SHARED_DIR/database/database.sqlite"

            echo "==> Preparing Laravel directories"

            mkdir -p "$RELEASE_DIR/bootstrap/cache"

            rm -rf "$RELEASE_DIR/storage"
            ln -s "$SHARED_DIR/storage" "$RELEASE_DIR/storage"

            rm -f "$RELEASE_DIR/.env"
            ln -s "$SHARED_DIR/.env" "$RELEASE_DIR/.env"

            rm -f "$RELEASE_DIR/database/database.sqlite"
            ln -s "$SHARED_DIR/database/database.sqlite" "$RELEASE_DIR/database/database.sqlite"

            echo "==> Fixing permissions"

            chown -R www-data:www-data "$SHARED_DIR/storage"
            chown -R www-data:www-data "$SHARED_DIR/database"
            chown -R www-data:www-data "$RELEASE_DIR/bootstrap/cache"

            chmod -R ug+rwX "$SHARED_DIR/storage"
            chmod -R ug+rwX "$SHARED_DIR/database"
            chmod -R ug+rwX "$RELEASE_DIR/bootstrap/cache"

            echo "==> Running Laravel migrations"

            cd "$RELEASE_DIR"

            php artisan migrate --force

            echo "==> Clearing old Laravel cache"

            php artisan optimize:clear

            echo "==> Building Laravel cache"

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "==> Activating release"

            ln -sfn "$RELEASE_DIR" "$CURRENT_DIR"

            echo "==> Restarting queue workers"

            php artisan queue:restart

            echo "==> Reloading PHP-FPM"

            if [ -n "${{ secrets.PHP_FPM_SERVICE }}" ]; then
              sudo systemctl reload "${{ secrets.PHP_FPM_SERVICE }}"
            fi

            echo "==> Cleaning old releases"

            ls -1dt "$REPO_PATH"/releases/* 2>/dev/null \
              | tail -n +6 \
              | xargs -r rm -rf

            echo "==> Deployment successful"
