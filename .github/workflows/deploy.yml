name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      - name: Validate Laravel application
        run: |
          test -f artisan
          test -d vendor

          echo "==> Laravel application ready"
          echo "Artisan:"
          ls -lh artisan

      - name: Create release archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='storage' \
            --exclude='database/database.sqlite' \
            --exclude='tests' \
            -czf release.tar.gz .

          echo "==> Release archive created"
          ls -lh release.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz

  # ============================================================
  # UPLOAD
  # ============================================================
  upload:
    name: Upload Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: .

      - name: Create release directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            REPO_PATH="${{ secrets.REMOTE_PATH }}"
            RELEASE_DIR="$REPO_PATH/releases/${{ github.sha }}"

            echo "==> Creating release directory"

            mkdir -p "$RELEASE_DIR"

      - name: Upload release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "release.tar.gz"
          target: "${{ secrets.REMOTE_PATH }}/releases/${{ github.sha }}"

  # ============================================================
  # PREPARE
  # ============================================================
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: upload

    steps:
      - name: Prepare release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            REPO_PATH="${{ secrets.REMOTE_PATH }}"
            RELEASE_DIR="$REPO_PATH/releases/${{ github.sha }}"
            SHARED_DIR="$REPO_PATH/shared"

            echo "==> Preparing directories"

            mkdir -p "$REPO_PATH/releases"
            mkdir -p "$SHARED_DIR/storage"
            mkdir -p "$SHARED_DIR/database"

            if [ ! -d "$RELEASE_DIR" ]; then
              echo "ERROR: Release directory does not exist:"
              echo "$RELEASE_DIR"
              exit 1
            fi

            echo "==> Extracting release"

            cd "$RELEASE_DIR"

            test -f release.tar.gz

            tar -xzf release.tar.gz
            rm -f release.tar.gz

            echo "==> Validating Laravel release"

            if [ ! -f "$RELEASE_DIR/artisan" ]; then
              echo "ERROR: artisan not found"
              echo "Release contents:"
              ls -la "$RELEASE_DIR"
              exit 1
            fi

            echo "==> Preparing .env"

            if [ ! -f "$SHARED_DIR/.env" ]; then
              if [ -f "$RELEASE_DIR/.env.example" ]; then
                cp "$RELEASE_DIR/.env.example" "$SHARED_DIR/.env"
              else
                echo "ERROR: .env.example not found"
                exit 1
              fi
            fi

            echo "==> Preparing SQLite"

            touch "$SHARED_DIR/database/database.sqlite"

            echo "==> Preparing Laravel directories"

            mkdir -p "$RELEASE_DIR/bootstrap/cache"
            mkdir -p "$RELEASE_DIR/database"

            mkdir -p "$SHARED_DIR/storage/framework/views"
            mkdir -p "$SHARED_DIR/storage/framework/cache"
            mkdir -p "$SHARED_DIR/storage/framework/sessions"
            mkdir -p "$SHARED_DIR/storage/logs"

            echo "==> Linking shared storage"

            rm -rf "$RELEASE_DIR/storage"
            ln -s "$SHARED_DIR/storage" "$RELEASE_DIR/storage"

            echo "==> Linking .env"

            rm -f "$RELEASE_DIR/.env"
            ln -s "$SHARED_DIR/.env" "$RELEASE_DIR/.env"

            echo "==> Linking SQLite database"

            rm -f "$RELEASE_DIR/database/database.sqlite"

            ln -s \
              "$SHARED_DIR/database/database.sqlite" \
              "$RELEASE_DIR/database/database.sqlite"

            echo "==> Fixing permissions"

            chown -R www-data:www-data "$SHARED_DIR/storage"
            chown -R www-data:www-data "$SHARED_DIR/database"
            chown -R www-data:www-data "$RELEASE_DIR/bootstrap/cache"

            chmod -R ug+rwX "$SHARED_DIR/storage"
            chmod -R ug+rwX "$SHARED_DIR/database"
            chmod -R ug+rwX "$RELEASE_DIR/bootstrap/cache"

            echo "==> Release prepared"

  # ============================================================
  # MIGRATE
  # ============================================================
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Run Laravel migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            REPO_PATH="${{ secrets.REMOTE_PATH }}"
            RELEASE_DIR="$REPO_PATH/releases/${{ github.sha }}"

            echo "==> Validating release"

            if [ ! -f "$RELEASE_DIR/artisan" ]; then
              echo "ERROR: artisan not found:"
              echo "$RELEASE_DIR/artisan"
              exit 1
            fi

            cd "$RELEASE_DIR"

            echo "==> Running migrations"

            php artisan migrate --force

  # ============================================================
  # CACHE
  # ============================================================
  cache:
    name: Build Laravel Cache
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - name: Build Laravel cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            REPO_PATH="${{ secrets.REMOTE_PATH }}"
            RELEASE_DIR="$REPO_PATH/releases/${{ github.sha }}"

            cd "$RELEASE_DIR"

            echo "==> Clearing old cache"

            php artisan optimize:clear

            echo "==> Building config cache"

            php artisan config:cache

            echo "==> Building route cache"

            php artisan route:cache

            echo "==> Building view cache"

            php artisan view:cache

  # ============================================================
  # ACTIVATE
  # ============================================================
  activate:
    name: Activate Release
    runs-on: ubuntu-latest
    needs: cache

    steps:
      - name: Activate release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            REPO_PATH="${{ secrets.REMOTE_PATH }}"
            RELEASE_DIR="$REPO_PATH/releases/${{ github.sha }}"
            CURRENT_DIR="$REPO_PATH/current"

            echo "==> Validating release"

            if [ ! -f "$RELEASE_DIR/artisan" ]; then
              echo "ERROR: Cannot activate release"
              echo "artisan not found:"
              echo "$RELEASE_DIR/artisan"
              exit 1
            fi

            echo "==> Activating release"

            ln -sfn "$RELEASE_DIR" "$CURRENT_DIR"

            echo "==> Restarting queue workers"

            cd "$RELEASE_DIR"
            php artisan queue:restart

            echo "==> Reloading PHP-FPM"

            if [ -n "${{ secrets.PHP_FPM_SERVICE }}" ]; then
              sudo systemctl reload "${{ secrets.PHP_FPM_SERVICE }}"
            fi

            echo "==> Release activated"

            echo "Current release:"
            readlink -f "$CURRENT_DIR"

  # ============================================================
  # CLEANUP
  # ============================================================
  cleanup:
    name: Cleanup Old Releases
    runs-on: ubuntu-latest
    needs: activate

    steps:
      - name: Cleanup old releases
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}"
          script: |
            set -e

            REPO_PATH="${{ secrets.REMOTE_PATH }}"

            echo "==> Cleaning old releases"

            ls -1dt "$REPO_PATH"/releases/* 2>/dev/null \
              | tail -n +6 \
              | xargs -r rm -rf

            echo "==> Deployment successful"
