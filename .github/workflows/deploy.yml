name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            .
            !.git
            !.github
            !node_modules
            !.env
            !storage
            !database/database.sqlite
            !tests
          include-hidden-files: true
  upload:
    name: Upload Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release

      - name: Upload release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "release/*"
          target: ${{ secrets.REMOTE_PATH }}/releases/${{ github.sha }}
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: upload

    steps:
      - name: Prepare release directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            REPO_PATH="${{ secrets.REMOTE_PATH }}"
            RELEASE_DIR="$REPO_PATH/releases/${{ github.sha }}"
            SHARED_DIR="$REPO_PATH/shared"

            echo "==> Preparing directories"

            mkdir -p "$REPO_PATH/releases"
            mkdir -p "$SHARED_DIR/storage"
            mkdir -p "$SHARED_DIR/database"

            echo "==> Checking .env"

            if [ ! -f "$SHARED_DIR/.env" ]; then
              echo "ERROR: Production .env not found:"
              echo "$SHARED_DIR/.env"
              exit 1
            fi

            echo "==> Preparing SQLite"

            touch "$SHARED_DIR/database/database.sqlite"

            echo "==> Preparing Laravel directories"

            mkdir -p "$RELEASE_DIR/bootstrap/cache"

            mkdir -p "$SHARED_DIR/storage/framework/views"
            mkdir -p "$SHARED_DIR/storage/framework/cache"
            mkdir -p "$SHARED_DIR/storage/framework/sessions"
            mkdir -p "$SHARED_DIR/storage/logs"
            mkdir -p "$RELEASE_DIR/database"

            echo "==> Linking shared storage"

            rm -rf "$RELEASE_DIR/storage"
            ln -s "$SHARED_DIR/storage" "$RELEASE_DIR/storage"

            echo "==> Linking .env"

            rm -f "$RELEASE_DIR/.env"
            ln -s "$SHARED_DIR/.env" "$RELEASE_DIR/.env"

            echo "==> Linking SQLite database"

            rm -f "$RELEASE_DIR/database/database.sqlite"
            ln -s "$SHARED_DIR/database/database.sqlite" \
              "$RELEASE_DIR/database/database.sqlite"

            echo "==> Fixing permissions"

            chown -R www-data:www-data "$SHARED_DIR/storage"
            chown -R www-data:www-data "$SHARED_DIR/database"
            chown -R www-data:www-data "$RELEASE_DIR/bootstrap/cache"

            chmod -R ug+rwX "$SHARED_DIR/storage"
            chmod -R ug+rwX "$SHARED_DIR/database"
            chmod -R ug+rwX "$RELEASE_DIR/bootstrap/cache"
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Run Laravel migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            REPO_PATH="${{ secrets.REMOTE_PATH }}"
            RELEASE_DIR="$REPO_PATH/releases/${{ github.sha }}"

            cd "$RELEASE_DIR"

            echo "==> Running migrations"

            php artisan migrate --force
  cache:
    name: Build Laravel Cache
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - name: Build Laravel cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            REPO_PATH="${{ secrets.REMOTE_PATH }}"
            RELEASE_DIR="$REPO_PATH/releases/${{ github.sha }}"

            cd "$RELEASE_DIR"

            echo "==> Clearing old cache"

            php artisan optimize:clear

            echo "==> Building config cache"

            php artisan config:cache

            echo "==> Building route cache"

            php artisan route:cache

            echo "==> Building view cache"

            php artisan view:cache
  activate:
    name: Activate Release
    runs-on: ubuntu-latest
    needs: cache

    steps:
      - name: Activate release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            REPO_PATH="${{ secrets.REMOTE_PATH }}"
            RELEASE_DIR="$REPO_PATH/releases/${{ github.sha }}"
            CURRENT_DIR="$REPO_PATH/current"

            echo "==> Activating release"

            ln -sfn "$RELEASE_DIR" "$CURRENT_DIR"

            echo "==> Restarting queue workers"

            cd "$RELEASE_DIR"
            php artisan queue:restart

            echo "==> Reloading PHP-FPM"

            if [ -n "${{ secrets.PHP_FPM_SERVICE }}" ]; then
              sudo systemctl reload "${{ secrets.PHP_FPM_SERVICE }}"
            fi

            echo "==> Release activated"
  cleanup:
    name: Cleanup Old Releases
    runs-on: ubuntu-latest
    needs: activate

    steps:
      - name: Cleanup old releases
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            REPO_PATH="${{ secrets.REMOTE_PATH }}"

            echo "==> Cleaning old releases"

            ls -1dt "$REPO_PATH"/releases/* 2>/dev/null \
              | tail -n +6 \
              | xargs -r rm -rf

            echo "==> Deployment successful"
